[build]
  command   = "npm run build"
  publish   = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Ship server deps as normal node_modules instead of bundling them
  external_node_modules = ["mongoose", "express", "serverless-http", "jsonwebtoken", "bcryptjs", "cors"]

# API -> Express app running in a Netlify Function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# Audio proxy: streams the demo MP3s through your own domain
# (same-origin = no CORS issues for playback & offline downloads)
[[redirects]]
  from   = "/audio/*"
  to     = "https://www.soundhelix.com/examples/mp3/:splat"
  status = 200
  force  = true

# React Router: send every other path to the SPA
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
